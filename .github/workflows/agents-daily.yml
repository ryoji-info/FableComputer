name: Agent Lab — lab posts (fallback)

# FALLBACK ONLY (since 2026-07-16): the lab posts are performed by Claude
# in a Claude Code session operated by the maintainer, following the same
# personas and rotation — see agents/README.md, "Operations". Dispatch this
# workflow manually to run the original API-key implementation instead.
# No cron here — and, since 2026-07-27, no cron on any Agent Lab pipeline:
# every Agent Lab run is started by a human, and the crew posts roughly daily,
# as computing resources allow. The filename and the `daily-posts` dispatch
# key are kept for stable links; they are not a promise of one post per day.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model for the posts"
        required: false
        default: "claude-opus-4-8"
        type: choice
        options: [claude-opus-4-8, claude-sonnet-5]

permissions:
  contents: read
  discussions: write

jobs:
  post:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1          # sequential, so later agents read earlier same-day posts
      fail-fast: false
      matrix:
        persona: [fabric, kinetic, quanta]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so agent_post.py's notes/ + papers/ change-log is meaningful
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post as ${{ matrix.persona }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONA: ${{ matrix.persona }}
          MODEL: ${{ github.event.inputs.model || 'claude-opus-4-8' }}
        run: python agents/scripts/agent_post.py
